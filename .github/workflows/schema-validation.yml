name: Contract validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-schema-fixtures:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate Draft 2020-12 schema fixtures
        run: python scripts/validate_schema_fixtures.py --verbose

      - name: Validate semantic fixtures
        run: python scripts/validate_semantic_fixtures.py --verbose

      - name: Validate edge-case coverage map
        run: python scripts/validate_edge_case_coverage.py

      - name: Validate raw source fixture baseline
        run: python scripts/validate_source_fixture_baseline.py

      - name: Run contract mutation regressions
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Verify M2E JavaScript interactions (Node.js required)
        run: |
          node --version
          python -m unittest discover -s tests -p 'test_m2e_dom_runtime.py'
          python -m unittest discover -s tests -p 'test_m2f_map_runtime.py'
          # Independent Codex counterexample must execute actual map JS, not a skipped fixture.
          python -m unittest discover -s tests -p 'test_m2_codex_p1_regression.py'

      - name: Verify patch whitespace
        run: git diff-tree --check HEAD^ HEAD

      - name: Verify installed wheel outside source checkout
        shell: bash
        run: |
          wheel_check_dir=$(mktemp -d)
          python -m pip wheel --no-deps . --wheel-dir "$wheel_check_dir/dist"
          python -m venv "$wheel_check_dir/venv"
          "$wheel_check_dir/venv/bin/python" -m pip install "$wheel_check_dir"/dist/*.whl
          cp tests/wheel_smoke.py "$wheel_check_dir/smoke.py"
          cd "$wheel_check_dir"
          env -u PYTHONPATH "$wheel_check_dir/venv/bin/python" smoke.py "$GITHUB_WORKSPACE/tests/source-fixtures" "$GITHUB_WORKSPACE"
          # Dedicated cross-checkpoint M2 exit witness: real FIT/GPX
          # equivalence, source byte integrity and no inferred gap paths.
          cp "$GITHUB_WORKSPACE/tests/m2_exit_wheel_smoke.py" "$wheel_check_dir/m2-exit.py"
          env -u PYTHONPATH "$wheel_check_dir/venv/bin/python" m2-exit.py "$GITHUB_WORKSPACE/tests/source-fixtures" "$GITHUB_WORKSPACE"
          # Exact sloped-boundary budget must hold in the installed artifact too.
          cp "$GITHUB_WORKSPACE/tests/test_sloped_boundary_budget.py" "$wheel_check_dir/sloped-budget.py"
          env -u PYTHONPATH "$wheel_check_dir/venv/bin/python" sloped-budget.py -v
          cp "$GITHUB_WORKSPACE/tests/test_dataclass_codec_admission.py" "$wheel_check_dir/codec-admission.py"
          env -u PYTHONPATH "$wheel_check_dir/venv/bin/python" codec-admission.py -v
          cp "$GITHUB_WORKSPACE/tests/test_bounded_file_ingestion.py" "$wheel_check_dir/bounded-file.py"
          env -u PYTHONPATH "$wheel_check_dir/venv/bin/python" bounded-file.py -v
          mkdir -p "$wheel_check_dir/scripts"
          cp "$GITHUB_WORKSPACE/scripts/strict_json.py" "$wheel_check_dir/scripts/strict_json.py"
          cp "$GITHUB_WORKSPACE/tests/test_strict_json_admission.py" "$wheel_check_dir/strict-json.py"
          env -u PYTHONPATH "$wheel_check_dir/venv/bin/python" strict-json.py -v
          cp "$GITHUB_WORKSPACE/tests/test_local_evidence_store.py" "$wheel_check_dir/local-evidence.py"
          env -u PYTHONPATH M3_SOURCE_FIXTURES="$GITHUB_WORKSPACE/tests/source-fixtures" "$wheel_check_dir/venv/bin/python" local-evidence.py -v
          cp "$GITHUB_WORKSPACE/tests/test_local_graph_store.py" "$wheel_check_dir/local-graph.py"
          env -u PYTHONPATH M3_SOURCE_FIXTURES="$GITHUB_WORKSPACE/tests/source-fixtures" "$wheel_check_dir/venv/bin/python" local-graph.py -v
          cp "$GITHUB_WORKSPACE/tests/test_local_review_store.py" "$wheel_check_dir/local-review.py"
          env -u PYTHONPATH M3_SOURCE_FIXTURES="$GITHUB_WORKSPACE/tests/source-fixtures" "$wheel_check_dir/venv/bin/python" local-review.py -v
          cp "$GITHUB_WORKSPACE/tests/test_local_task_store.py" "$wheel_check_dir/local-tasks.py"
          env -u PYTHONPATH M3_SOURCE_FIXTURES="$GITHUB_WORKSPACE/tests/source-fixtures" "$wheel_check_dir/venv/bin/python" local-tasks.py -v
          cp "$GITHUB_WORKSPACE/tests/test_local_archive.py" "$wheel_check_dir/local-archive.py"
          env -u PYTHONPATH M3_SOURCE_FIXTURES="$GITHUB_WORKSPACE/tests/source-fixtures" "$wheel_check_dir/venv/bin/python" local-archive.py -v
          cp "$GITHUB_WORKSPACE/tests/test_resource_budgets.py" "$wheel_check_dir/resource-budgets.py"
          env -u PYTHONPATH M3_SOURCE_FIXTURES="$GITHUB_WORKSPACE/tests/source-fixtures" "$wheel_check_dir/venv/bin/python" resource-budgets.py -v
